<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="基金自习室">
  <meta name="description" content="基金应知应会205题个人刷题、模拟考试与错题复习网站">
  <title>基金应知应会 · 自习室</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="data/questions.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">基</div>
        <div><strong>基金自习室</strong><span>FUND STUDY ROOM</span></div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard"><span data-icon="home"></span>学习首页</button>
        <button class="nav-item" data-view="setup"><span data-icon="practice"></span>刷题与模考</button>
        <button class="nav-item" data-view="wrong"><span data-icon="wrong"></span>我的错题<span class="nav-badge" id="wrongBadge">0</span></button>
        <button class="nav-item" data-view="bank"><span data-icon="bank"></span>题库与收藏</button>
        <button class="nav-item" data-view="history"><span data-icon="history"></span>考试记录</button>
      </nav>
      <div class="sidebar-note">
        <span class="note-dot"></span>
        <p>学习数据仅保存在<br>当前浏览器中</p>
      </div>
      <div class="sidebar-footer">205 道真题 · 逐题解析<br><span>安静积累，稳步通过</span></div>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" aria-label="打开导航"><span data-icon="menu"></span></button>
        <div class="topbar-title" id="topbarTitle">学习首页</div>
        <div class="topbar-actions">
          <span class="save-status"><span class="save-dot"></span>自动保存</span>
          <button class="icon-button" id="exportButton" aria-label="导出学习数据" title="导出学习数据"><span data-icon="download"></span></button>
        </div>
      </header>
      <main id="mainContent" tabindex="-1"></main>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importInput" accept="application/json" hidden>
</body>
</html>
